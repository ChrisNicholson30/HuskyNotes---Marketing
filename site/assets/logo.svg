<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- symbol so it can be referenced via <use href="logo.svg#husky">.
       Gradient lives INSIDE the symbol so it resolves when cloned into a host page. -->
  <symbol id="husky" viewBox="0 0 64 64">
    <defs>
      <linearGradient id="huskyEar" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#7FD0FF"/>
        <stop offset="1" stop-color="#3DA9FC"/>
      </linearGradient>
    </defs>
    <!-- rounded badge -->
    <rect x="2" y="2" width="60" height="60" rx="15" fill="#0B1622"/>
    <!-- ears -->
    <path d="M16 14 L26 24 L14 28 Z" fill="url(#huskyEar)"/>
    <path d="M48 14 L38 24 L50 28 Z" fill="url(#huskyEar)"/>
    <path d="M18 17 L24 23 L17 25 Z" fill="#0B1622"/>
    <path d="M46 17 L40 23 L47 25 Z" fill="#0B1622"/>
    <!-- face -->
    <path d="M32 21
             C42 21 47 28 47 37
             C47 46 40 52 32 52
             C24 52 17 46 17 37
             C17 28 22 21 32 21 Z" fill="#E6EEF5"/>
    <!-- eye mask markings -->
    <path d="M32 24 C27 24 23 28 22 35 C25 33 28 33 30 35 C31 31 31 27 32 24 Z" fill="#3DA9FC"/>
    <path d="M32 24 C37 24 41 28 42 35 C39 33 36 33 34 35 C33 31 33 27 32 24 Z" fill="#3DA9FC"/>
    <!-- eyes -->
    <circle cx="26" cy="37" r="3" fill="#0B1622"/>
    <circle cx="38" cy="37" r="3" fill="#0B1622"/>
    <circle cx="27" cy="36" r="1" fill="#7FD0FF"/>
    <circle cx="39" cy="36" r="1" fill="#7FD0FF"/>
    <!-- snout + nose -->
    <path d="M28 43 L36 43 L34 49 L30 49 Z" fill="#E6EEF5"/>
    <circle cx="32" cy="45" r="2.4" fill="#0B1622"/>
    <path d="M32 47 L32 50" stroke="#0B1622" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <!-- default render when the file is opened directly (favicon / preview) -->
  <use href="#husky"/>
</svg>
