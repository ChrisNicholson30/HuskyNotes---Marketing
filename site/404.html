<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Page not found — Husky Notes</title>
  <meta name="description" content="The page you were looking for couldn't be found. Head back to Husky Notes — the free, open-source Markdown notes app for iPhone, iPad and Mac." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#0B1622" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#F4F8FB" media="(prefers-color-scheme: light)" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem('husky-theme');
        if (!t) t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error { min-height: 80vh; display: grid; place-items: center; text-align: center; padding: 80px 24px; }
    .error__code { font-family: var(--mono); font-size: clamp(60px, 14vw, 120px); font-weight: 800; color: var(--accent-2); letter-spacing: -.04em; line-height: 1; }
    .error h1 { font-size: clamp(24px, 4vw, 36px); margin: 12px 0 10px; }
    .error p { color: var(--text-2); font-size: 17px; max-width: 34em; margin: 0 auto 28px; }
  </style>
</head>
<body>
  <main class="error">
    <div>
      <span class="brand__mark brand__mark--lg" aria-hidden="true">
        <img src="assets/husky-logo.png" width="56" height="56" alt="" decoding="async" />
      </span>
      <div class="error__code">404</div>
      <h1>This page wandered off</h1>
      <p>The page you were looking for couldn't be found — but your notes are safe. Let's get you back on track.</p>
      <a class="btn btn--primary btn--lg" href="/">Back to Husky Notes</a>
    </div>
  </main>
</body>
</html>
